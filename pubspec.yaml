name: alison_test
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.10.3


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_spinkit: ^5.2.2
  gap: ^3.0.1
  flutter_svg: ^2.2.3
  carousel_slider: ^5.1.1
  cached_network_image: ^3.4.1
  dio: ^5.9.0
  get_it: ^9.2.0
  pretty_dio_logger: ^1.4.0
  dartz: ^0.10.1
  injectable: ^2.5.0
  flutter_dropdown_alert: ^1.0.7
  flutter_bloc: ^8.1.6
  freezed_annotation: ^2.4.4
  equatable: ^2.0.7
 


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  injectable_generator: ^2.6.2
  build_runner: ^2.4.13
  freezed: ^2.5.2


flutter:


  uses-material-design: true


  assets:
     - assets/fonts/
     - assets/images/
     - assets/svg/






  
  fonts:


     - family: Lufga
       fonts:
        - asset: assets/fonts/LufgaRegular.ttf
          weight: 400
        - asset: assets/fonts/LufgaMedium.ttf
          weight: 500
        - asset: assets/fonts/LufgaSemiBold.ttf
          weight: 600
        - asset: assets/fonts/LufgaBold.ttf
          weight: 700

